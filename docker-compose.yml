version: '3.8'

services:
  # 1. Python FastAPI Backend Web Server
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-fastapi-backend
    ports:
      - "${SERVER_PORT:-3000}:3000"
      - "${MICROSERVICE_GRPC_PORT:-3001}:3001"
    environment:
      - SERVER_ENV=${SERVER_ENV:-development}
      - SERVER_PORT=3000
      - SQL_HOST=postgresql
      - SQL_PORT=5432
      - SQL_USER=${SQL_USER:-aisoft}
      - SQL_PASSWORD=${SQL_PASSWORD:-aisoft}
      - SQL_DB=${SQL_DB:-aisoft}
      - MONGODB_URI=mongodb://mongodb:27017/${MONGODB_NAME:-aisoft}?replicaSet=rs0&directConnection=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MICROSERVICE_RABBITMQ_URL=${MICROSERVICE_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # 2. Celery Worker (Background Excel/Docx Batch Import Jobs)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - SQL_HOST=postgresql
      - MONGODB_URI=mongodb://mongodb:27017/${MONGODB_NAME:-aisoft}?replicaSet=rs0&directConnection=true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 3. PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    container_name: python-postgres
    environment:
      POSTGRES_DB: ${SQL_DB:-aisoft}
      POSTGRES_USER: ${SQL_USER:-aisoft}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-aisoft}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${SQL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-aisoft} -d ${SQL_DB:-aisoft}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 4. Redis Server (Cache & Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: python-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 5. MongoDB Database (ReplicaSet rs0 for ChangeStreams/Transactions)
  mongodb:
    image: mongo:7
    container_name: python-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_NAME:-aisoft}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 6. MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: python-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  minio-data:
